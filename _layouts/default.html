  <body>
    <div class="container-lg px-3 my-5 markdown-body">

      <!-- IQX watch: start -->
      <canvas id="network-canvas" aria-hidden="true"></canvas>
<style>
  #network-canvas {
    position: fixed;
    inset: 0;
    width: 125%;
    height: 125%;
    z-index: 0;
    pointer-events: none;
    background: transparent;
  }
</style>
<script>
(function () {
  var canvas = document.getElementById("network-canvas");
  if (!canvas || canvas.dataset.ready) return;
  canvas.dataset.ready = "1";
  var ctx = canvas.getContext("2d");
  var nodes = [];
  var w = 0;
  var h = 0;
  var dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 4);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.max(48, Math.floor((w * h) / 14000));
    nodes = [];
    for (var i = 0; i < count; i++) {
      nodes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.28,
        vy: (Math.random() - 0.5) * 0.28
      });
    }
  }

  function frame() {
    ctx.clearRect(0, 0, w, h);
    var max = 150;
    
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    var isSlow = conn && (conn.saveData || conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g' || conn.rtt > 300);
    var nodeColor = isSlow ? "rgba(255,100,100,0.9)" : "rgba(61,240,214,0.9)";
    var lineColor = isSlow ? "rgba(255,100,100," : "rgba(61,240,214,";

    for (var i = 0; i < nodes.length; i++) {
      var a = nodes[i];
      a.x += a.vx;
      a.y += a.vy;
      if (a.x < 0 || a.x > w) a.vx *= -1;
      if (a.y < 0 || a.y > h) a.vy *= -1;
      
      ctx.beginPath();
      ctx.fillStyle = nodeColor;
      ctx.arc(a.x, a.y, 1.25, 0, Math.PI * 2);
      ctx.fill();

      for (var j = i + 1; j < nodes.length; j++) {
        var b = nodes[j];
        var dx = a.x - b.x;
        var dy = a.y - b.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < max) {
          ctx.beginPath();
          ctx.strokeStyle = lineColor + (1 - d / max) * 0.32 + ")";
          ctx.lineWidth = 1;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
})();
</script>

<div class="iqx-wrap">
  <div class="iqx-watch" id="iqx-watch">
    <div class="bezel" id="bezel"></div>
    
    <!-- Real-Time Sun & Moon Celestial Orbit (Synchronized with Terminator) -->
    <div class="celestial-orbit" id="celestial-orbit">
      <div class="sun-icon">☀️</div>
      <div class="moon-icon">🌙</div>
    </div>

    <!-- Solar Terminator Day/Night Orbital Shadow Overlay -->
    <div class="solar-terminator" id="solar-terminator"></div>

    <div class="dial">
      <div class="hour-marks" id="hour-marks"></div>
      <div class="brand" id="brand-status">Morningstar</div>
      <div class="digital" id="digital">0:00</div>
      <div class="hand hour" id="hour"><span></span></div>
      <div class="hand minute" id="minute"><span></span></div>
      <div class="hand second" id="second"></div>
      <div class="pin"></div>
    </div>
  </div>
</div>

<style>
  .iqx-wrap { display:flex; justify-content:center; padding:8px 0 20px; position:relative; z-index:1; }
  .iqx-watch {
    --yellow:#ffe24a;
    --teal:#3df0d6;
    --gray:#9b9b9b;
    --alert-red:#ff4a4a;
    width:280px; height:280px; position:relative;
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
    border-radius: 50%;
  }

  .bezel {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg at 50% 50%, 
      var(--yellow) 0deg, 
      var(--yellow) 120deg, 
      var(--gray) 120deg, 
      var(--gray) 360deg
    );
    box-shadow: 0 8px 22px rgba(0,0,0,.3);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 32px), #000 calc(100% - 31px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 32px), #000 calc(100% - 31px));
    z-index: 2;
    transition: filter 0.3s ease;
  }

  /* Celestial Orbit Layer (Sun & Moon) */
  .celestial-orbit {
    position: absolute;
    inset: 22px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    transition: transform 1s linear;
  }
  .sun-icon {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    filter: drop-shadow(0 0 4px rgba(255, 226, 74, 0.8));
  }
  .moon-icon {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
  }

  /* Solar Terminator Shadow Overlay */
  .solar-terminator {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.02) 50%, rgba(10, 15, 30, 0.4) 100%);
    pointer-events: none;
    z-index: 4;
    mix-blend-mode: multiply;
    transition: transform 1s linear;
  }

  .iqx-watch.high-latency .bezel {
    filter: drop-shadow(0 0 8px rgba(255, 74, 74, 0.6));
    animation: bezel-pulse 1.5s infinite alternate;
  }

  @keyframes bezel-pulse {
    0% { opacity: 0.8; }
    100% { opacity: 1; transform: scale(1.01); }
  }

  .bezel .tick {
    position: absolute; left: 50%; top: 0; width: 24px; margin-left: -12px;
    height: 100%; transform-origin: center center; pointer-events: none;
  }
  .bezel .tick i {
    display: block; margin: 5px auto 0; background: #ffffff; border-radius: 1px;
  }
  .bezel .tick.minor i { width: 3px; height: 8px; }
  .bezel .tick.major i { width: 8px; height: 18px; }
  .bezel .tick.dot i { width: 8px; height: 8px; border-radius: 50%; background: #ffffff; }
  
  .bezel .tick.num {
    color: #ffffff;
    font: 700 20px/1 "Courier New", Courier, monospace;
    text-align: center; padding-top: 7px;
  }

  .bezel .top-pip {
    position: absolute; left: 50%; top: 4px; width: 0; height: 0;
    margin-left: -8px; z-index: 3;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 13px solid #ffffff;
    pointer-events: none;
  }

  .dial {
    position:absolute; inset:32px; border-radius:50%;
    background: transparent;
    box-shadow: none;
    z-index: 5;
  }
  .hour-marks .hm {
    position:absolute; left:50%; top:0; width:18px; margin-left:-9px;
    height:100%; transform-origin:center center;
  }
  .hour-marks .hm b {
    display:block; margin:10px auto 0; background:var(--yellow);
  }
  .hour-marks .hm.dot b { width:9px; height:9px; border-radius:50%; }
  .hour-marks .hm.bat b { width:16px; height:7px; border-radius:1px; }
  .hour-marks .hm.tri b {
    width:0; height:0; background:none;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:12px solid var(--yellow);
  }
  .brand {
    position:absolute; left:50%; top:28%;
    transform:translateX(-50%);
    font: 700 13px/1 "Courier New", Courier, monospace;
    letter-spacing:.0em; color:#fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.65);
    z-index: 6;
  }
  .digital {
    position:absolute; left:50%; bottom:23%;
    transform:translateX(-50%);
    font: 700 26px/1 "Courier New", Courier, monospace;
    color:#fff; letter-spacing:.04em;
    text-shadow: 0 1px 2px rgba(0,0,0,.65);
    z-index: 6;
  }
  .hand { position:absolute; left:50%; top:50%; transform-origin:50% 100%; z-index: 7; }
  .hour { width:20px; height:48px; margin:-52px 0 0 -9px; }
  .hour span {
    display:block; width:100%; height:100%; background:var(--teal);
    clip-path:polygon(50% 0,70% 16%,70% 56%,58% 56%,58% 100%,42% 100%,42% 56%,30% 56%,30% 16%);
  }
  .minute { width:14px; height:76px; margin:-76px 0 0 -6px; z-index: 8; }
  .minute span {
    display:block; width:100%; height:100%; background:#3df0d6;
    clip-path:polygon(50% 0,76% 10%,68% 100%,32% 100%,24% 10%);
  }
  .second {
    width:2px; height:88px; margin:-88px 0 0 -1px;
    background:var(--yellow); z-index: 9;
  }
  .second::before {
    content:""; position:absolute; left:50%; top:16px;
    width:8px; height:8px; margin-left:-4px;
    border-radius:50%; background:#fff;
    box-shadow:0 0 0 2px var(--yellow);
  }
  .second::after {
    content:""; position:absolute; left:50%; bottom:-12px;
    width:2px; height:12px; margin-left:-1px; background:var(--teal);
  }
  .pin {
    position:absolute; left:50%; top:50%;
    width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%; background:#9b9b9b;
    box-shadow:0 0 0 2px var(--yellow); z-index: 10;
  }
</style>

<script>
(function(){
  var bezel = document.getElementById("bezel");
  var hours = document.getElementById("hour-marks");
  var watchContainer = document.getElementById("iqx-watch");
  var brandStatus = document.getElementById("brand-status");
  var solarTerminator = document.getElementById("solar-terminator");
  var celestialOrbit = document.getElementById("celestial-orbit");

  if(!bezel || bezel.dataset.ready) return;
  bezel.dataset.ready = "1";

  var topPip = document.createElement("div");
  topPip.className = "top-pip";
  bezel.appendChild(topPip);

  for(var i = 1; i < 60; i++){
    var el = document.createElement("div");
    el.className = "tick";
    el.style.transform = "rotate(" + (i * 6) + "deg)";

    if(i === 30 || i === 40 || i === 50){
      el.className += " num";
      var lab = document.createElement("span");
      lab.textContent = i;
      lab.style.display = "block";
      lab.style.transform = "rotate(" + (-i * 6) + "deg)";
      el.appendChild(lab);
    } else if(i < 20 && i % 2 === 0){
      el.className += " dot";
      el.innerHTML = "<i></i>";
    } else if(i % 5 === 0){
      el.className += " major";
      el.innerHTML = "<i></i>";
    } else {
      el.className += " minor";
      el.innerHTML = "<i></i>";
    }
    bezel.appendChild(el);
  }

  for(var h = 0; h < 12; h++){
    var hm = document.createElement("div");
    hm.className = "hm " + (h === 0 ? "tri" : (h === 3 || h === 9 ? "bat" : "dot"));
    hm.style.transform = "rotate(" + (h * 30) + "deg)";
    hm.innerHTML = "<b></b>";
    hours.appendChild(hm);
  }

  var hour = document.getElementById("hour");
  var minute = document.getElementById("minute");
  var second = document.getElementById("second");
  var digital = document.getElementById("digital");

  function pad(n){ return n < 10 ? "0" + n : "" + n; }

  function checkNetworkStatus() {
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn) {
      if (conn.saveData || conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g' || conn.rtt > 300) {
        watchContainer.classList.add("high-latency");
        brandStatus.textContent = "LAG DETECTED";
        brandStatus.style.color = "var(--alert-red)";
      } else {
        watchContainer.classList.remove("high-latency");
        brandStatus.textContent = "Morningstar";
        brandStatus.style.color = "#9b9b9b";
      }
    }
  }

  function tick(){
    var now = new Date();
    var s = now.getSeconds() + now.getMilliseconds() / 1000;
    var m = now.getMinutes() + s / 60;
    var hr = (now.getHours() % 12) + m / 60;
    
    // Watch hands rotation
    hour.style.transform = "rotate(" + (hr * 30) + "deg)";
    minute.style.transform = "rotate(" + (m * 6) + "deg)";
    second.style.transform = "rotate(" + (s * 6) + "deg)";
    
    var h24 = now.getHours();
    var h12 = h24 % 12; if(!h12) h12 = 12;
    digital.textContent = h12 + ":" + pad(now.getMinutes());

    // Exact fractional hours for celestial & orbital calculations
    var totalHours = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
    
    // Unified orbital angle for both the shadow and the sun/moon tracker
    var orbitalAngle = (totalHours / 24) * 360;
    solarTerminator.style.transform = "rotate(" + orbitalAngle + "deg)";
    celestialOrbit.style.transform = "rotate(" + orbitalAngle + "deg)";
  }
  
  tick();
  setInterval(tick, 1000);
  
  setInterval(checkNetworkStatus, 5000);
  checkNetworkStatus();
})();
</script>

<!-- IQX watch: end -->
