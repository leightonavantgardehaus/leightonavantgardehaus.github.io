      <!-- IQX watch: start -->
     <canvas id="network-canvas" aria-hidden="true"></canvas>
<style>
  #network-canvas {
    position: fixed;
    inset: 0;
    width: 125%;
    height: 125%;
    z-index: 0;
    pointer-events: none;
    background: transparent;
  }
</style>
<script>
(function () {
  var canvas = document.getElementById("network-canvas");
  if (!canvas || canvas.dataset.ready) return;
  canvas.dataset.ready = "1";
  var ctx = canvas.getContext("2d");
  var nodes = [];
  var w = 0, h = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 4);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.max(48, Math.floor((w * h) / 14000));
    nodes = [];
    for (var i = 0; i < count; i++) {
      nodes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.28,
        vy: (Math.random() - 0.5) * 0.28
      });
    }
  }
  function frame() {
    ctx.clearRect(0, 0, w, h);
    var max = 150;
    for (var i = 0; i < nodes.length; i++) {
      var a = nodes[i];
      a.x += a.vx;
      a.y += a.vy;
      if (a.x < 0 || a.x > w) a.vx *= -1;
      if (a.y < 0 || a.y > h) a.vy *= -1;
      ctx.beginPath();
      ctx.fillStyle = "rgba(61,240,214,0.9)";
      ctx.arc(a.x, a.y, 1.25, 0, Math.PI * 2);
      ctx.fill();
      for (var j = i + 1; j < nodes.length; j++) {
        var b = nodes[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < max) {
          ctx.beginPath();
          ctx.strokeStyle = "rgba(61,240,214," + (1 - d / max) * 0.32 + ")";
          ctx.lineWidth = 1;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(frame);
  }
  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
})();
</script>

<div class="iqx-wrap">
  <div class="iqx-watch">
    <div class="case"></div>
    <div class="bezel-photo" role="img" aria-label="IQX bezel"></div>
    <div class="dial">
      <div class="brand">IQX</div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="pin"></div>
    </div>
  </div>
</div>

<style>
  .iqx-wrap {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    padding: 16px 0 28px;
    background: transparent;
  }
  .iqx-watch {
    --yellow: #ffe24a;
    --teal: #3df0d6;
    width: 300px;
    height: 300px;
    position: relative;
    filter: drop-shadow(0 14px 24px rgba(0,0,0,.45));
  }
  /* thin outer steel rim only — center punched out */
  .case {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, #d5d9de 0%, #8b9198 45%, #3a3e44 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent 72%, #000 73%);
            mask: radial-gradient(farthest-side, transparent 72%, #000 73%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.4),
      0 2px 8px rgba(0,0,0,.25);
  }
  .bezel-photo {
    position: absolute;
    inset: 3%;
    border-radius: 50%;
    background: url("/images/bezel.webp") center / contain no-repeat;
    pointer-events: none;
  }
  .dial {
    position: absolute;
    inset: 20%;
    border-radius: 50%;
    background: transparent;
  }
  .brand {
    position: absolute;
    left: 50%;
    top: 26%;
    transform: translateX(-50%);
    font: 700 13px/1 "Fira Code", monospace;
    letter-spacing: 0.22em;
    color: var(--yellow);
    text-shadow: 0 1px 6px rgba(0,0,0,.65);
  }
  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 1px;
  }
  .hour {
    width: 5px;
    height: 40px;
    margin: -40px 0 0 -2.5px;
    background: linear-gradient(180deg, var(--yellow), #c9a60a);
    z-index: 3;
  }
  .minute {
    width: 3.5px;
    height: 56px;
    margin: -56px 0 0 -1.75px;
    background: #fff;
    z-index: 4;
  }
  .second {
    width: 1.5px;
    height: 64px;
    margin: -50px 0 0 -0.75px;
    background: var(--teal);
    z-index: 5;
  }
  .second::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 12px;
    width: 6px;
    height: 6px;
    margin-left: -3px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 1.5px var(--teal);
  }
  .second::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -10px;
    width: 1.5px;
    height: 10px;
    margin-left: -0.75px;
    background: var(--teal);
  }
  .pin {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 9px;
    height: 9px;
    margin: -4.5px 0 0 -4.5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #eee, #222 70%);
    box-shadow: 0 0 0 2px #111;
    z-index: 6;
  }
</style>

<script>
(function () {
  var hour = document.getElementById("hour");
  var minute = document.getElementById("minute");
  var second = document.getElementById("second");
  if (!hour) return;
  function tick() {
    var now = new Date();
    var s = now.getSeconds() + now.getMilliseconds() / 1000;
    var m = now.getMinutes() + s / 60;
    var hr = (now.getHours() % 12) + m / 60;
    hour.style.transform = "rotate(" + (hr * 30) + "deg)";
    minute.style.transform = "rotate(" + (m * 6) + "deg)";
    second.style.transform = "rotate(" + (s * 6) + "deg)";
  }
  tick();
  setInterval(tick, 50);
})();
</script>
<!-- IQX watch: end -->
