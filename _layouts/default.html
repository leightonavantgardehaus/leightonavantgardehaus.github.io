      <!-- IQX watch: start -->
     <canvas id="network-canvas" aria-hidden="true"></canvas>
<style>
  #network-canvas {
    position: fixed;
    inset: 0;
    width: 125%;
    height: 125%;
    z-index: 0;
    pointer-events: none;
    background: transparent;
  }
</style>
<script>
(function () {
  var canvas = document.getElementById("network-canvas");
  if (!canvas || canvas.dataset.ready) return;
  canvas.dataset.ready = "1";
  var ctx = canvas.getContext("2d");
  var nodes = [];
  var w = 0, h = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 4);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.max(48, Math.floor((w * h) / 14000));
    nodes = [];
    for (var i = 0; i < count; i++) {
      nodes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.28,
        vy: (Math.random() - 0.5) * 0.28
      });
    }
  }
  function frame() {
    ctx.clearRect(0, 0, w, h);
    var max = 150;
    for (var i = 0; i < nodes.length; i++) {
      var a = nodes[i];
      a.x += a.vx;
      a.y += a.vy;
      if (a.x < 0 || a.x > w) a.vx *= -1;
      if (a.y < 0 || a.y > h) a.vy *= -1;
      ctx.beginPath();
      ctx.fillStyle = "rgba(61,240,214,0.9)";
      ctx.arc(a.x, a.y, 1.25, 0, Math.PI * 2);
      ctx.fill();
      for (var j = i + 1; j < nodes.length; j++) {
        var b = nodes[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < max) {
          ctx.beginPath();
          ctx.strokeStyle = "rgba(61,240,214," + (1 - d / max) * 0.32 + ")";
          ctx.lineWidth = 1;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(frame);
  }
  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
})();
</script>

<div class="iqx-wrap">
  <div class="iqx-watch" id="iqx-watch">
    <div class="case">
      <img class="bezel" id="bezel" alt="" draggable="false"
        src="/images/bezel.webp">
      <div class="dial">
        <div class="marks" id="track"></div>
        <div class="marks" id="hour-marks"></div>
        <div class="brand">IQX</div>
        <div class="sub">DIVER</div>
        <div class="depth">200M</div>
        <div class="hands">
          <div class="hand hour" id="hour"></div>
          <div class="hand minute" id="minute"></div>
          <div class="hand second" id="second"></div>
          <div class="pin"></div>
        </div>
        <div class="glass"></div>
      </div>
    </div>
  </div>
</div>

<style>
  .iqx-wrap {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    padding: 12px 0 24px;
    background: transparent;
  }
  .iqx-watch {
    --accent: #e0a91f;
    --lume: #eaf4cf;
    --rim: #8d949b;
    width: 300px;
    height: 300px;
    position: relative;
    filter: drop-shadow(0 18px 24px rgba(0,0,0,.5));
  }

  /* steel rim only — center cut out so no gray disc */
  .case {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      conic-gradient(from 20deg, #aeb4bb, #f1f3f5, #80878f, #e4e7ea, #6b727a, #f1f3f5, #aeb4bb);
    -webkit-mask: radial-gradient(farthest-side, transparent 78%, #000 79%);
            mask: radial-gradient(farthest-side, transparent 78%, #000 79%);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.55),
      inset 0 2px 2px rgba(255,255,255,.7),
      inset 0 -4px 8px rgba(0,0,0,.45);
  }

  .bezel {
    position: absolute;
    inset: 4%;
    width: 92%;
    height: 92%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .dial {
    position: absolute;
    inset: 18%;
    border-radius: 50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(255,255,255,0) 0 3deg, rgba(0,0,0,.03) 3deg 6deg),
      radial-gradient(circle at 50% 35%, #fbfcfd 0, #e9ecef 60%, #cdd2d7 100%);
    box-shadow:
      0 0 0 2px #aab0b6,
      0 0 0 4px #30343a,
      inset 0 6px 14px rgba(0,0,0,.25);
    overflow: hidden;
  }
  .marks { position: absolute; inset: 0; }
  .marks .mt {
    position: absolute;
    left: 50%;
    top: 0;
    width: 4px;
    margin-left: -2px;
    height: 100%;
    transform-origin: center;
  }
  .marks .mt i {
    display: block;
    margin: 4px auto 0;
    width: 1.5px;
    height: 5px;
    background: #2b2f34;
  }
  .marks .mt.five i { width: 2.5px; height: 7px; }
  .marks .hm {
    position: absolute;
    left: 50%;
    top: 0;
    width: 20px;
    margin-left: -10px;
    height: 100%;
    transform-origin: center;
  }
  .marks .hm b { display: block; margin: 12px auto 0; box-sizing: border-box; }
  .marks .hm.dot b {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid var(--rim);
    background: radial-gradient(circle at 40% 35%, #fff, var(--lume) 75%);
    box-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
  .marks .hm.bat b {
    margin-top: 10px;
    width: 12px;
    height: 22px;
    border-radius: 2px;
    border: 2px solid var(--rim);
    background: linear-gradient(90deg, var(--lume), #fff 50%, var(--lume));
    box-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
  .marks .hm.tri b {
    position: relative;
    margin-top: 9px;
    width: 16px;
    height: 14px;
    background: var(--rim);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .marks .hm.tri b::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--lume);
    clip-path: polygon(50% 26%, 82% 86%, 18% 86%);
  }

  .brand, .sub, .depth {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-family: "Fira Code", Arial, sans-serif;
  }
  .brand {
    top: 24%;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .22em;
    color: #15181b;
  }
  .sub {
    top: 34%;
    font-weight: 700;
    font-size: 8px;
    letter-spacing: .2em;
    color: #5f666d;
  }
  .depth {
    top: 68%;
    font-weight: 700;
    font-size: 8px;
    letter-spacing: .12em;
    color: #5f666d;
  }

  .hands {
    position: absolute;
    inset: 0;
    filter: drop-shadow(2px 4px 2px rgba(0,0,0,.35));
    pointer-events: none;
  }
  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
  }
  .hour, .minute {
    background: linear-gradient(90deg, #f6f8fa 0 50%, #98a0a7 50% 100%);
    clip-path: polygon(50% 0, 100% 12%, 100% 100%, 0 100%, 0 12%);
  }
  .hour::after, .minute::after {
    content: "";
    position: absolute;
    left: 50%;
    width: 2.5px;
    margin-left: -1.25px;
    top: 14px;
    bottom: 6px;
    background: var(--lume);
  }
  .hour   { width: 9px;  height: 48px; margin: -48px 0 0 -4.5px; z-index: 3; }
  .minute { width: 6px;  height: 68px; margin: -68px 0 0 -3px;   z-index: 4; }
  .second {
    width: 2px;
    height: 84px;
    margin: -72px 0 0 -1px;
    transform-origin: 50% 72px;
    background: var(--accent);
    z-index: 5;
  }
  .second::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 14px;
    width: 7px;
    height: 7px;
    margin-left: -3.5px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: #fff;
    box-sizing: border-box;
  }
  .second::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 5px;
    height: 12px;
    margin-left: -2.5px;
    background: var(--accent);
    border-radius: 1px;
  }
  .pin {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #8d949b 45%, #2a2d31 100%);
    box-shadow: 0 0 0 2px var(--accent);
    z-index: 6;
  }
  .glass {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 8;
    background:
      linear-gradient(140deg, rgba(255,255,255,.45) 0, rgba(255,255,255,.1) 28%, rgba(255,255,255,0) 42%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,.12) 100%);
  }
</style>

<script>
(function () {
  var bezel = document.getElementById("bezel");
  var marks = document.getElementById("hour-marks");
  var track = document.getElementById("track");
  if (!bezel || bezel.dataset.ready) return;
  bezel.dataset.ready = "1";

  for (var t = 0; t < 60; t++) {
    var mt = document.createElement("div");
    mt.className = "mt" + (t % 5 === 0 ? " five" : "");
    mt.style.transform = "rotate(" + (t * 6) + "deg)";
    mt.innerHTML = "<i></i>";
    track.appendChild(mt);
  }
  for (var h = 0; h < 12; h++) {
    var hm = document.createElement("div");
    var kind = "dot";
    if (h === 0) kind = "tri";
    if (h === 3 || h === 6 || h === 9) kind = "bat";
    hm.className = "hm " + kind;
    hm.style.transform = "rotate(" + (h * 30) + "deg)";
    hm.innerHTML = "<b></b>";
    marks.appendChild(hm);
  }

  var hour = document.getElementById("hour");
  var minute = document.getElementById("minute");
  var second = document.getElementById("second");
  function frame() {
    var d = new Date();
    var sc = d.getSeconds() + d.getMilliseconds() / 1000;
    var m = d.getMinutes() + sc / 60;
    var hr = (d.getHours() % 12) + m / 60;
    hour.style.transform = "rotate(" + (hr * 30) + "deg)";
    minute.style.transform = "rotate(" + (m * 6) + "deg)";
    second.style.transform = "rotate(" + (sc * 6) + "deg)";
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
<!-- IQX watch: end -->
