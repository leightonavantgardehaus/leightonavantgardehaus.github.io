  <body>
    <div class="container-lg px-3 my-5 markdown-body">

      <!-- IQX watch: start -->
      <canvas id="network-canvas" aria-hidden="true"></canvas>
<style>
  #network-canvas {
    position: fixed;
    inset: 0;
    width: 125%;
    height: 125%;
    z-index: 0;
    pointer-events: none;
    background: transparent;
  }
</style>
<script>
(function () {
  var canvas = document.getElementById("network-canvas");
  if (!canvas || canvas.dataset.ready) return;
  canvas.dataset.ready = "1";
  var ctx = canvas.getContext("2d");
  var nodes = [];
  var w = 0;
  var h = 0;
  var dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 4);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.max(48, Math.floor((w * h) / 14000));
    nodes = [];
    for (var i = 0; i < count; i++) {
      nodes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.28,
        vy: (Math.random() - 0.5) * 0.28
      });
    }
  }

  function frame() {
    ctx.clearRect(0, 0, w, h);
    var max = 150;
    
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    var isSlow = conn && (conn.saveData || conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g' || conn.rtt > 300);
    var nodeColor = isSlow ? "rgba(255,100,100,0.9)" : "rgba(61,240,214,0.9)";
    var lineColor = isSlow ? "rgba(255,100,100," : "rgba(61,240,214,";

    for (var i = 0; i < nodes.length; i++) {
      var a = nodes[i];
      a.x += a.vx;
      a.y += a.vy;
      if (a.x < 0 || a.x > w) a.vx *= -1;
      if (a.y < 0 || a.y > h) a.vy *= -1;
      
      ctx.beginPath();
      ctx.fillStyle = nodeColor;
      ctx.arc(a.x, a.y, 1.25, 0, Math.PI * 2);
      ctx.fill();

      for (var j = i + 1; j < nodes.length; j++) {
        var b = nodes[j];
        var dx = a.x - b.x;
        var dy = a.y - b.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < max) {
          ctx.beginPath();
          ctx.strokeStyle = lineColor + (1 - d / max) * 0.32 + ")";
          ctx.lineWidth = 1;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
})();
</script>

<div class="iqx-wrap">
  <div class="iqx-watch" id="iqx-watch">
    <div class="bezel" id="bezel"></div>
    
    <!-- Solar Terminator Day/Night Orbital Overlay -->
    <div class="solar-terminator" id="solar-terminator"></div>

    <div class="dial">
      <div class="hour-marks" id="hour-marks"></div>
      <div class="brand" id="brand-status">Morningstar</div>
      <div class="digital" id="digital">0:00</div>
      <div class="hand hour" id="hour"><span></span></div>
      <div class="hand minute" id="minute"><span></span></div>
      <div class="hand second" id="second"></div>
      <div class="pin"></div>
    </div>
  </div>
</div>

<style>
  .iqx-wrap { display:flex; justify-content:center; padding:8px 0 20px; position:relative; z-index:1; }
  .iqx-watch {
    --yellow:#ffe24a;
    --teal:#3df0d6;
    --gray:#9b9b9b;
    --alert-red:#ff4a4a;
    width:280px; height:280px; position:relative;
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
    border-radius: 50%;
  }

  .bezel {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg at 50% 50%, 
      var(--yellow) 0deg, 
      var(--yellow) 120deg, 
      var(--gray) 120deg, 
      var(--gray) 360deg
    );
    box-shadow: 0 8px 22px rgba(0,0,0,.3);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 32px), #000 calc(100% - 31px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 32px), #000 calc(100% - 31px));
    z-index: 2;
    transition: filter 0.3s ease;
  }

  /* Solar Terminator Shadow Overlay */
  .solar-terminator {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0.05) 50%, rgba(10, 15, 30, 0.45) 100%);
    pointer-events: none;
    z-index: 4; /* Sits over bezel/dial, but below hands */
    mix-blend-mode: multiply;
    transition: transform 1s linear;
  }

  .iqx-watch.high-latency .bezel {
    filter: drop-shadow(0 0 8px rgba(255, 74, 74, 0.6));
    animation: bezel-pulse 1.5s infinite alternate;
  }

  @keyframes bezel-pulse {
    0% { opacity: 0.8; }
    100% { opacity: 1; transform: scale(1.01); }
  }

  .bezel .tick {
    position: absolute; left: 50%; top: 0; width: 24px; margin-left: -12px;
    height: 100%; transform-origin: center center; pointer-events: none;
  }
  .bezel .tick i {
    display: block; margin: 5px auto 0; background: #ffffff; border-radius: 1px;
  }
  .bezel .tick.minor i { width: 4px; height: 8px; }
  .bezel .tick.major i { width: 8px; height: 18px; }
  .bezel .tick.dot i { width: 8px; height: 8px; border-radius: 50%; background: #ffffff; }
  
  .bezel .tick.num {
    color: #ffffff;
    font: 700 20px/1 "Courier New", Courier, monospace;
    text-align: center; padding-top: 7px;
  }

  .bezel .top-pip {
    position: absolute; left: 50%; top: 4px; width: 0; height: 0;
    margin-left: -8px; z-index: 3;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 13px solid #ffffff;
    pointer-events: none;
  }

  .dial {
    position:absolute; inset:32px; border-radius:50%;
    background: transparent;
    box-shadow: none;
    z-index: 3;
  }
  .hour-marks .hm {
    position:absolute; left:50%; top:0; width:18px; margin-left:-9px;
    height:100%; transform-origin:center center;
  }
  .hour-marks .hm b {
    display:block; margin:10px auto 0; background:var(--yellow);
  }
  .hour-marks .hm.dot b { width:10px; height:10px; border-radius:50%; }
  .hour-marks .hm.bat b { width:18px; height:8px; border-radius:1px; }
  .hour-marks .hm.tri b {
    width:0; height:0; background:none;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:12px solid var(--yellow);
  }
  .brand {
    position:absolute; left:50%; top:28%;
    transform:translateX(-50%);
    font: 700 14px/1 "Courier New", Courier, monospace;
    letter-spacing:.0em; color:#fff;
    text-shadow: 0 0px 1px rgba(0,0,0,.65);
    z-index: 5;
  }
  .digital {
    position:absolute; left:50%; bottom:23%;
    transform:translateX(-50%);
    font: 700 26px/1 "Courier New", Courier, monospace;
    color:#fff; letter-spacing:.04em;
    text-shadow: 0 0px 1px rgba(0,0,0,.65);
    z-index: 5;
  }
  .hand { position:absolute; left:50%; top:50%; transform-origin:50% 100%; z-index: 6; }
  .hour { width:19px; height:52px; margin:-52px 0 0 -9px; }
  .hour span {
    display:block; width:100%; height:100%; background:var(--teal);
    clip-path:polygon(50% 0,70% 16%,70% 56%,58% 56%,58% 100%,42% 100%,42% 56%,30% 56%,30% 16%);
  }
  .minute { width:14px; height:76px; margin:-76px 0 0 -6px; z-index: 7; }
  .minute span {
    display:block; width:100%; height:100%; background:#3df0d6;
    clip-path:polygon(50% 0,76% 10%,68% 100%,32% 100%,24% 10%);
  }
  .second {
    width:2px; height:88px; margin:-88px 0 0 -1px;
    background:var(--yellow); z-index: 8;
  }
  .second::before {
    content:""; position:absolute; left:50%; top:16px;
    width:8px; height:8px; margin-left:-4px;
    border-radius:50%; background:#fff;
    box-shadow:0 0 0 2px var(--teal);
  }
  .second::after {
    content:""; position:absolute; left:50%; bottom:-12px;
    width:2px; height:12px; margin-left:-1px; background:var(--yellow);
  }
  .pin {
    position:absolute; left:50%; top:50%;
    width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%; background:#9b9b9b;
    box-shadow:0 0 0 2px var(--yellow); z-index: 9;
  }
</style>

<script>
(function(){
  var bezel = document.getElementById("bezel");
  var hours = document.getElementById("hour-marks");
  var watchContainer = document.getElementById("iqx-watch");
  var brandStatus = document.getElementById("brand-status");
  var solarTerminator = document.getElementById("solar-terminator");

  if(!bezel || bezel.dataset.ready) return;
  bezel.dataset.ready = "1";

  var topPip = document.createElement("div");
  topPip.className = "top-pip";
  bezel.appendChild(topPip);

  for(var i = 1; i < 60; i++){
    var el = document.createElement("div");
    el.className = "tick";
    el.style.transform = "rotate(" + (i * 6) + "deg)";

    if(i === 30 || i === 40 || i === 50){
      el.className += " num";
      var lab = document.createElement("span");
      lab.textContent = i;
      lab.style.display = "block";
      lab.style.transform = "rotate(" + (-i * 6) + "deg)";
      el.appendChild(lab);
    } else if(i < 20 && i % 2 === 0){
      el.className += " dot";
      el.innerHTML = "<i></i>";
    } else if(i % 5 === 0){
      el.className += " major";
      el.innerHTML = "<i></i>";
    } else {
      el.className += " minor";
      el.innerHTML = "<i></i>";
    }
    bezel.appendChild(el);
  }

  for(var h = 0; h < 12; h++){
    var hm = document.createElement("div");
    hm.className = "hm " + (h === 0 ? "tri" : (h === 3 || h === 9 ? "bat" : "dot"));
    hm.style.transform = "rotate(" + (h * 30) + "deg)";
    hm.innerHTML = "<b></b>";
    hours.appendChild(hm);
  }

  var hour = document.getElementById("hour");
  var minute = document.getElementById("minute");
  var second = document.getElementById("second");
  var digital = document.getElementById("digital");

  function pad(n){ return n < 10 ? "0" + n : "" + n; }

  function checkNetworkStatus() {
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn) {
      if (conn.saveData || conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g' || conn.rtt > 300) {
        watchContainer.classList.add("high-latency");
        brandStatus.textContent = "LAG DETECTED";
        brandStatus.style.color = "var(--alert-red)";
      } else {
        watchContainer.classList.remove("high-latency");
        brandStatus.textContent = "Morningstar";
        brandStatus.style.color = "#9b9b9b";
      }
    }
  }

  function tick(){
    var now = new Date();
    var s = now.getSeconds() + now.getMilliseconds() / 1000;
    var m = now.getMinutes() + s / 60;
    var hr = (now.getHours() % 12) + m / 60;
    
    // Watch hands rotation
    hour.style.transform = "rotate(" + (hr * 30) + "deg)";
    minute.style.transform = "rotate(" + (m * 6) + "deg)";
    second.style.transform = "rotate(" + (s * 6) + "deg)";
    
    var h24 = now.getHours();
    var h12 = h24 % 12; if(!h12) h12 = 12;
    digital.textContent = h12 + ":" + pad(now.getMinutes());

    // Solar Terminator orbital shadow rotation (24-hour cycle mapped to 360 degrees)
    var totalHours = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
    var orbitalAngle = (totalHours / 24) * 360;
    solarTerminator.style.transform = "rotate(" + orbitalAngle + "deg)";

    requestAnimationFrame(tick);
  }
  
  tick();
  
  setInterval(checkNetworkStatus, 5000);
  checkNetworkStatus();
})();
</script>

<script>
/* IQX radar sweep (add-on). Nothing above is edited: this watches the network canvas's own draw calls. */
(function () {
  var watch = document.getElementById("iqx-watch");
  var net = document.getElementById("network-canvas");
  var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (!watch || !net || !P || P.__iqxRadar) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  P.__iqxRadar = true;

  var RANGE = 108;   // reset every frame from the dial's real radius, so the sweep never leaves the dial
  var dial = watch.querySelector(".dial") || watch;
  var TRAIL = 100;   // length of the fading trail, in degrees
  var cx = 0, cy = 0, hand = 0, on = false;
  var col = "61,240,214", core = "0,170,150";
  var clearRect = P.clearRect, arc = P.arc;

  // once per frame: work out the watch centre and the second-hand angle, draw the beam
  P.clearRect = function () {
    clearRect.apply(this, arguments);
    if (this.canvas !== net) return;

    var r = watch.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
    on = r.bottom > 0 && r.top < window.innerHeight && r.right > 0 && r.left < window.innerWidth;
    RANGE = dial.getBoundingClientRect().width / 2;
    if (!on) return;

    var lag = watch.classList.contains("high-latency");
    col = lag ? "255,74,74" : "61,240,214";
    core = lag ? "200,30,30" : "0,170,150";

    var d = new Date();
    hand = (d.getSeconds() + d.getMilliseconds() / 1000) * 6;   // same maths as the second hand
    var th = hand * Math.PI / 180 - Math.PI / 2;
    var tr = TRAIL * Math.PI / 180;

    this.save();

    var rings = new Path2D();
    rings.arc(cx, cy, RANGE * 2 / 3, 0, 6.2832);
    rings.moveTo(cx + RANGE / 3, cy);
    rings.arc(cx, cy, RANGE / 3, 0, 6.2832);
    this.strokeStyle = "rgba(" + col + ",0.09)";
    this.lineWidth = 1;
    this.stroke(rings);

    if (this.createConicGradient) {
      var f = tr / (2 * Math.PI);
      var g = this.createConicGradient(th - tr, cx, cy);
      g.addColorStop(0, "rgba(" + col + ",0)");
      g.addColorStop(f, "rgba(" + col + ",0.2)");
      g.addColorStop(Math.min(f + 0.0005, 1), "rgba(" + col + ",0)");
      g.addColorStop(1, "rgba(" + col + ",0)");
      var wedge = new Path2D();
      wedge.moveTo(cx, cy);
      wedge.arc(cx, cy, RANGE, th - tr, th);
      wedge.closePath();
      this.fillStyle = g;
      this.fill(wedge);
    }

    var lx = cx + Math.cos(th) * RANGE, ly = cy + Math.sin(th) * RANGE;
    var lg = this.createLinearGradient(cx, cy, lx, ly);
    lg.addColorStop(0, "rgba(" + col + ",0.55)");
    lg.addColorStop(1, "rgba(" + col + ",0)");
    var line = new Path2D();
    line.moveTo(cx, cy);
    line.lineTo(lx, ly);
    this.strokeStyle = lg;
    this.lineWidth = 1.5;
    this.stroke(line);

    this.restore();
  };

  // for every network node (the 1.25px dots): glow it if the sweep just passed over it
  P.arc = function (x, y, rad) {
    arc.apply(this, arguments);
    if (!on || rad !== 1.25 || this.canvas !== net) return;

    var dx = x - cx, dy = y - cy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > RANGE) return;

    var a = Math.atan2(dx, -dy) * 180 / Math.PI;   // 0 = up, clockwise
    if (a < 0) a += 360;
    var behind = hand - a;
    if (behind < 0) behind += 360;
    if (behind > TRAIL) return;

    var t = 1 - behind / TRAIL;
    var k = t * t * (1 - 0.5 * dist / RANGE);
    if (k < 0.03) return;

    var R = 4 + 9 * k;
    var g = this.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, "rgba(" + col + "," + (0.85 * k) + ")");
    g.addColorStop(1, "rgba(" + col + ",0)");
    var halo = new Path2D();
    halo.arc(x, y, R, 0, 6.2832);
    var dot = new Path2D();
    dot.arc(x, y, 1.8, 0, 6.2832);

    this.save();                       // save/restore leaves your own fillStyle and path untouched
    this.fillStyle = g;
    this.fill(halo);
    this.fillStyle = "rgba(" + core + "," + k + ")";
    this.fill(dot);
    this.restore();
  };
})();
</script>
