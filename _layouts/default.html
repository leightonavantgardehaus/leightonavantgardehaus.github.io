<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

{% seo %}

    {% include head-custom.html %}

  <body>
    <div class="container-lg px-3 my-5 markdown-body">

      <!-- IQX watch: start -->
      <canvas id="network-canvas" aria-hidden="true"></canvas>
<style>
  #network-canvas {
    position: fixed;
    inset: 0;
    width: 125%;
    height: 125%;
    z-index: 0;
    pointer-events: none;
    background: transparent;
  }
</style>
<script>
(function () {
  var canvas = document.getElementById("network-canvas");
  if (!canvas || canvas.dataset.ready) return;
  canvas.dataset.ready = "1";
  var ctx = canvas.getContext("2d");
  var nodes = [];
  var w = 0;
  var h = 0;
  var dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 4);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.max(48, Math.floor((w * h) / 14000));
    nodes = [];
    for (var i = 0; i < count; i++) {
      nodes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.28,
        vy: (Math.random() - 0.5) * 0.28
      });
    }
  }
  function frame() {
    ctx.clearRect(0, 0, w, h);
    var max = 150;
    for (var i = 0; i < nodes.length; i++) {
      var a = nodes[i];
      a.x += a.vx;
      a.y += a.vy;
      if (a.x < 0 || a.x > w) a.vx *= -1;
      if (a.y < 0 || a.y > h) a.vy *= -1;
      ctx.beginPath();
      ctx.fillStyle = "rgba(61,240,214,0.9)";
      ctx.arc(a.x, a.y, 1.25, 0, Math.PI * 2);
      ctx.fill();
      for (var j = i + 1; j < nodes.length; j++) {
        var b = nodes[j];
        var dx = a.x - b.x;
        var dy = a.y - b.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < max) {
          ctx.beginPath();
          ctx.strokeStyle = "rgba(61,240,214," + (1 - d / max) * 0.32 + ")";
          ctx.lineWidth = 1;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(frame);
  }
  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
})();
</script>
<div class="iqx-wrap">
  <div class="iqx-watch" id="iqx-watch">
    <div class="bezel" id="bezel"></div>
    <div class="dial">
      <div class="hour-marks" id="hour-marks"></div>
      <div class="brand">Morningstar</div>
      <div class="digital" id="digital">0:00</div>
      <div class="hand hour" id="hour"><span></span></div>
      <div class="hand minute" id="minute"><span></span></div>
      <div class="hand second" id="second"></div>
      <div class="pin"></div>
    </div>
  </div>
</div>
<style>
  .iqx-wrap { display:flex; justify-content:center; padding:8px 0 20px; position:relative; z-index:1; }
  .iqx-watch {
    --yellow:#ffe24a;
    --teal:#3df0d6;
    --gray:#9b9b9b;
    --ink:#2b2b2b;
    width:280px; height:280px; position:relative;
    font-family: "Courier New", Courier, monospace; /* base font */
  }
  .bezel {
    position:absolute; inset:0; border-radius:50%;
    background: conic-gradient(from -90deg, var(--teal) 0 180deg, var(--gray) 180deg 360deg);
    box-shadow: 0 8px 22px rgba(0,0,0,.18);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 32px), #000 calc(100% - 31px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 32px), #000 calc(100% - 31px));
  }
  .bezel .tick {
    position:absolute; left:50%; top:0; width:20px; margin-left:-10px;
    height:100%; transform-origin:center center; pointer-events:none;
  }
  .bezel .tick i {
    display:block; margin:8px auto 0; background:var(--ink);
    border-radius:1px;
  }
  .bezel .tick.minor i { width:2px; height:8px; }
  .bezel .tick.major i { width:3px; height:12px; }
  .bezel .tick.num {
    color:var(--ink);
    font: 700 11px/1 "Courier New", Courier, monospace; /* ← Courier */
    text-align:center; padding-top:6px;
  }
  .bezel .tick.num.light { color:#fff; }
  .bezel .pip {
    position:absolute; left:50%; top:7px; width:14px; height:9px;
    margin-left:-7px; background:var(--ink);
    clip-path:polygon(50% 0,100% 100%,0 100%);
  }
  .dial {
    position:absolute; inset:32px; border-radius:50%;
    background: transparent;
    box-shadow: none;
  }
  .hour-marks .hm {
    position:absolute; left:50%; top:0; width:18px; margin-left:-9px;
    height:100%; transform-origin:center center;
  }
  .hour-marks .hm b {
    display:block; margin:10px auto 0; background:var(--yellow);
  }
  .hour-marks .hm.dot b { width:9px; height:9px; border-radius:50%; }
  .hour-marks .hm.bat b { width:16px; height:7px; border-radius:1px; }
  .hour-marks .hm.tri b {
    width:0; height:0; background:none;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:12px solid var(--yellow);
  }
  .brand {
    position:absolute; left:50%; top:28%;
    transform:translateX(-50%);
    font: 700 13px/1 "Courier New", Courier, monospace; /* ← Courier */
    letter-spacing:.0em; color:var(--gray);
    text-shadow: 0 0px 0px rgba(0,0,0,.65);
  }
  .digital {
    position:absolute; left:50%; bottom:23%;
    transform:translateX(-50%);
    font: 700 26px/1 "Courier New", Courier, monospace; /* ← Courier */
    color:#fff; letter-spacing:.04em;
    text-shadow: 0 1px 0px rgba(0,0,0,.65);
  }
  .hand { position:absolute; left:50%; top:50%; transform-origin:50% 100%; }
  .hour { width:19px; height:52px; margin:-52px 0 0 -9px; z-index:3; }
  .hour span {
    display:block; width:100%; height:100%; background:var(--teal);
    clip-path:polygon(50% 0,70% 16%,70% 56%,58% 56%,58% 100%,42% 100%,42% 56%,30% 56%,30% 16%);
  }
  .minute { width:13px; height:76px; margin:-76px 0 0 -6px; z-index:4; }
  .minute span {
    display:block; width:100%; height:100%; background:#3df0d6;
    clip-path:polygon(50% 0,76% 10%,68% 100%,32% 100%,24% 10%);
  }
  .second {
    width:2px; height:88px; margin:-88px 0 0 -1px;
    background:var(--yellow); z-index:5;
  }
  .second::before {
    content:""; position:absolute; left:50%; top:16px;
    width:8px; height:8px; margin-left:-4px;
    border-radius:50%; background:#fff;
    box-shadow:0 0 0 2px var(--teal);
  }
  .second::after {
    content:""; position:absolute; left:50%; bottom:-12px;
    width:2px; height:12px; margin-left:-1px; background:var(--teal);
  }
  .pin {
    position:absolute; left:50%; top:50%;
    width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%; background:var(--gray);
    box-shadow:0 0 0 2px var(--yellow); z-index:6;
  }
</style>
<script>
(function(){
  var bezel=document.getElementById("bezel");
  var hours=document.getElementById("hour-marks");
  if(!bezel || bezel.dataset.ready) return;
  bezel.dataset.ready="1";
  var pip=document.createElement("div");
  pip.className="pip";
  bezel.appendChild(pip);
  for(var i=1;i<60;i++){
    var el=document.createElement("div");
    el.className="tick";
    el.style.transform="rotate("+ (i*6) +"deg)";
    if(i%10===0){
      el.className+=" num"+(i>=20 && i<=40 ? " light":"");
      var lab=document.createElement("span");
      lab.textContent=(i===0?"": (i<10?"0":"")+i);
      lab.style.display="block";
      lab.style.transform="rotate("+ (-i*6) +"deg)";
      el.appendChild(lab);
    } else if(i%5===0){
      el.className+=" major";
      el.innerHTML="<i></i>";
    } else {
      el.className+=" minor";
      el.innerHTML="<i></i>";
    }
    bezel.appendChild(el);
  }
  for(var h=0;h<12;h++){
    var hm=document.createElement("div");
    hm.className="hm "+(h===0?"tri":(h===3||h===9?"bat":"dot"));
    hm.style.transform="rotate("+(h*30)+"deg)";
    hm.innerHTML="<b></b>";
    hours.appendChild(hm);
  }
  var hour=document.getElementById("hour");
  var minute=document.getElementById("minute");
  var second=document.getElementById("second");
  var digital=document.getElementById("digital");
  function pad(n){return n<10?"0"+n:""+n;}
  function tick(){
    var now=new Date();
    var s=now.getSeconds()+now.getMilliseconds()/1000;
    var m=now.getMinutes()+s/60;
    var hr=(now.getHours()%12)+m/60;
    hour.style.transform="rotate("+(hr*30)+"deg)";
    minute.style.transform="rotate("+(m*6)+"deg)";
    second.style.transform="rotate("+(s*6)+"deg)";
    var h24=now.getHours();
    var h12=h24%12; if(!h12) h12=12;
    digital.textContent=h12+":"+pad(now.getMinutes());
  }
  tick();
  setInterval(tick,50);
})();
</script>
<!-- IQX watch: end -->
